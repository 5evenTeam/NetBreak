name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the CLI responds
        run: |
          python -m netbreak --version
          python -m netbreak --list-engines

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Prepare engine output directories
        run: mkdir -p engines/go/bin engines/cpp/bin

      - name: Build the Go engine
        working-directory: engines/go
        run: go build -trimpath -ldflags "-s -w" -o bin/netbreak-engine .

      - name: Build the C++ engine
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          g++ -std=c++17 -O3 -Wall -Wextra \
            -o engines/cpp/bin/netbreak-native \
            native/cpp/src/main.cpp native/cpp/src/icmp.cpp -lpthread

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite with native engines present
        run: python -m pytest -q -k "engine"
