[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netbreak"
version = "0.1.0"
description = "NetBreak - a fast, friendly TUI port scanner for authorized network reconnaissance."
readme = "README.md"
license = "MIT"
authors = [{ name = "5evenTeam" }]
requires-python = ">=3.10"
keywords = ["pentest", "security", "port-scanner", "tui", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "textual>=0.85",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/5evenTeam/NetBreak"
Repository = "https://github.com/5evenTeam/NetBreak"

[project.scripts]
netbreak = "netbreak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["netbreak"]
